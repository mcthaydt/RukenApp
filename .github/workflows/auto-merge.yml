# Turns on GitHub's auto-merge for every finished pull request, so GitHub merges it by itself once the
# required checks (verify and browser) pass on a branch up to date with main. Sessions may not merge, and the
# Owner should not have to merge each one by hand.
# Owner, 2026-11-13: "bro what do we need to do to make it where I'm not constantly doing this", then
# "Yes, add it" to this workflow. This file changes only on the Owner's words, quoted in the commit (CLAUDE.md).
#
# A draft is still being worked on, so it is left alone; marking it ready for review is the signal that it is
# done. Pull requests from forks are skipped: only branches pushed to this repository merge by themselves.
# Nothing from the pull request is checked out or run here; the job only calls the GitHub API.
# A merge made this way does not start CI on main (GitHub does not let its own token trigger workflows), which
# is safe because main's protection already requires both checks to pass on a branch up to date with main.
name: Auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  # The branch clean-up below also runs every hour, because a merge made by this workflow's own token starts
  # no further workflow runs (GitHub's rule), so nothing else would fire after the merge.
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: auto-merge
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge with a merge commit once the checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"

  # GitHub's "delete branch after merge" setting does not act on merges made by auto-merge here, so merged
  # branches piled up. Owner, 2026-11-13: "Yes, add it" to deleting them here.
  # A branch is deleted only if a merged pull request came from it and the branch still points at exactly the
  # commit that was merged: a branch that got new commits after its merge is left alone, and so is main.
  delete-merged-branches:
    name: delete merged branches
    if: github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete branches whose pull request is merged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/pulls?state=closed&per_page=50" \
            --jq '.[] | select(.merged_at != null and .head.repo.full_name == env.REPO) | "\(.head.ref) \(.head.sha)"' |
          while read -r ref sha; do
            [ "$ref" = "main" ] && continue
            current=$(gh api "repos/$REPO/git/ref/heads/$ref" --jq .object.sha 2>/dev/null) || continue
            if [ "$current" = "$sha" ]; then
              echo "Deleting $ref (merged at $sha)"
              gh api -X DELETE "repos/$REPO/git/refs/heads/$ref"
            fi
          done
