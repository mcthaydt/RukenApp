# Turns on GitHub's auto-merge for every finished pull request, so GitHub merges it by itself once the
# required checks (verify, postgres, browser, and gate once required) pass on a branch up to date with main.
# Sessions may not merge, and the Owner should not have to merge each one by hand.
# Owner, 2026-11-13: "bro what do we need to do to make it where I'm not constantly doing this", then
# "Yes, add it" to this workflow. This file changes only on the Owner's words, quoted in the commit (CLAUDE.md).
#
# A draft is still being worked on, so it is left alone; marking it ready for review is the signal that it is
# done. Pull requests from forks are skipped: only branches pushed to this repository merge by themselves.
# Nothing from the pull request is checked out or run here; the job only calls the GitHub API.
# A merge made this way does not start CI on main (GitHub does not let its own token trigger workflows). So the
# `test-main` job below starts CI on main by hand when main's newest commit has no run yet (Owner, 2026-11-16:
# "yes to 1–3, keep 12", where 2 was "let main run CI after a merge"). It runs on every event here, and every hour.
name: Auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  # The branch clean-up below also runs every hour, because a merge made by this workflow's own token starts
  # no further workflow runs (GitHub's rule), so nothing else would fire after the merge.
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: auto-merge
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge with a merge commit once the checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"

  # GitHub's "delete branch after merge" setting does not act on merges made by auto-merge here, so merged
  # branches piled up. Owner, 2026-11-13: "Yes, add it" to deleting them here.
  # Branches of pull requests closed without merging piled up too. Owner, 2026-11-14: "Yes, no unnecessary PR,
  # branches, anything" to deleting those as well, a day after the close, so a mistaken close can be undone.
  # A branch is deleted only if it still points at exactly the commit its pull request ended on: a branch that
  # got new commits afterwards is someone's work in progress and is left alone. So is a branch that an open
  # pull request still uses, and so is main.
  delete-merged-branches:
    name: delete merged branches
    if: github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete branches whose pull request is merged, or closed for a day
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # ISO 8601 times in UTC compare correctly as plain strings.
          export CUTOFF=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
          open_refs=$(gh api "repos/$REPO/pulls?state=open&per_page=100" --jq '.[].head.ref')
          # Newest closes first: sorted by creation, an old pull request that merged late fell outside the page.
          gh api "repos/$REPO/pulls?state=closed&sort=updated&direction=desc&per_page=50" \
            --jq '.[] | select(.head.repo.full_name == env.REPO)
                  | select(.merged_at != null or .closed_at < env.CUTOFF)
                  | "\(.head.ref) \(.head.sha)"' |
          while read -r ref sha; do
            case "$ref" in main) continue ;; esac
            printf '%s\n' "$open_refs" | grep -qxF "$ref" && continue
            current=$(gh api "repos/$REPO/git/ref/heads/$ref" --jq .object.sha 2>/dev/null) || continue
            if [ "$current" = "$sha" ]; then
              echo "Deleting $ref (its pull request ended at $sha)"
              gh api -X DELETE "repos/$REPO/git/refs/heads/$ref"
            fi
          done

  # Starts CI on main when main's newest commit has never been tested. `workflow_dispatch` is the one event this
  # workflow's own token may start, so this is how a merge made by auto-merge still gets its run on main.
  test-main:
    name: test main after a merge
    if: github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start CI on main if its newest commit has no run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(gh api "repos/$REPO/commits/main" --jq .sha)
          runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=1" --jq .total_count)
          if [ "$runs" = "0" ]; then
            echo "main at $sha has no CI run yet: starting one"
            gh workflow run ci.yml --repo "$REPO" --ref main
          else
            echo "main at $sha already has a CI run"
          fi
