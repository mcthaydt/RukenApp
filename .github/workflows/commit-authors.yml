# Who wrote each commit, and how the pull request ends (CLAUDE.md, "Identity"). Added at the 2026-11-17 setup
# check. It is its own workflow, beside CI's `gate`, because it must run again when the pull request's text is
# edited, and an edit should not rerun every test. Branch protection requires both `gate` and `commit-authors`.
# This file changes only on the Owner's words, quoted in the commit.
#
# It fails when one of the pull request's own commits:
# - is not authored and committed by McThayDT <107786093+mcthaydt@users.noreply.github.com>, or
# - carries a Claude co-author or a "Claude-Session" trailer;
# and when the pull request's text does not end with "Requested by **McThayDT**", or carries a
# "Generated by" or "Generated with" line.
name: commit-authors

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  group: commit-authors-${{ github.ref }}
  cancel-in-progress: true

# Only reads, through the API. Nothing from the pull request is checked out or run.
permissions:
  contents: read
  pull-requests: read

jobs:
  commit-authors:
    name: commit-authors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every commit and the pull request's text
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: McThayDT
          EMAIL: 107786093+mcthaydt@users.noreply.github.com
          LAST_LINE: Requested by **McThayDT**
        run: |
          bad=0
          # The pull request's own commits only, read fresh so an edit sees the current state.
          gh api --paginate "repos/$REPO/pulls/$NUMBER/commits" \
            --jq '.[] | [.sha[0:7], .commit.author.name, .commit.author.email, .commit.committer.name, .commit.committer.email] | @tsv' |
          while IFS=$'\t' read -r sha an ae cn ce; do
            if [ "$an" != "$AUTHOR" ] || [ "$ae" != "$EMAIL" ] || [ "$cn" != "$AUTHOR" ] || [ "$ce" != "$EMAIL" ]; then
              echo "::error::$sha is authored by $an <$ae> and committed by $cn <$ce>, not $AUTHOR <$EMAIL>"
              echo bad >> "$RUNNER_TEMP/bad"
            fi
          done
          gh api --paginate "repos/$REPO/pulls/$NUMBER/commits" --jq '.[] | .sha[0:7] + " " + (.commit.message | @base64)' |
          while read -r sha msg; do
            if printf '%s' "$msg" | base64 -d | grep -Eiq '^(co-authored-by:.*(claude|anthropic)|claude-session:)'; then
              echo "::error::$sha carries a Claude co-author or a Claude-Session trailer"
              echo bad >> "$RUNNER_TEMP/bad"
            fi
          done
          [ -f "$RUNNER_TEMP/bad" ] && bad=1

          body=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.body // ""' | tr -d '\r')
          last=$(printf '%s\n' "$body" | sed -e '/^[[:space:]]*$/d' | tail -n 1)
          if [ "$last" != "$LAST_LINE" ]; then
            echo "::error::The pull request's last line is \"$last\", not \"$LAST_LINE\""
            bad=1
          fi
          if printf '%s\n' "$body" | grep -Eiq 'generated (by|with)'; then
            echo "::error::The pull request carries a \"Generated by\" or \"Generated with\" line"
            bad=1
          fi
          test "$bad" = 0 && echo "Every commit and the pull request's text are right."
