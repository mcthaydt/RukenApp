# Deploys ruken.io from GitHub, only after the tests passed on main (spec 2026-11-22-deploy-from-green-main).
# Owner, 2026-11-22: "A": deploy from GitHub Actions after the tests pass on main, then check the live site.
#
# Why a separate workflow and not a job in ci.yml: ci.yml has no secrets and forks run it. `workflow_run` always
# runs the copy of this file on the default branch, so a pull request cannot change what deploys.
#
# Rolling back is by hand and never automatic (a migration may already have run):
#   pnpm exec wrangler rollback
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

# One deploy at a time, and never stop one halfway. GitHub keeps one waiting job per group, so a waiting deploy can
# be replaced by a newer one; the target step makes that harmless by always picking the newest green commit.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to ruken.io
    # A pull request run, a fork or a red run never deploys. A fork's branch named main passes the `branches` filter,
    # so the event and the repository are checked here.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The key lives in this environment, which only main may use. No `env` here or at the top: each secret is given
    # to the one step that needs it, so install scripts and build plugins never see it.
    environment: production
    steps:
      # The target step has to run before the commit to ship is known, so it runs from the commit this workflow
      # file came from (github.sha), in its own folder; the commit to ship is checked out at the root after it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tip
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: pick the commit to deploy
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: tip/.github/scripts/deploy-target.sh

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.target.outputs.deploy == 'true'
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.target.outputs.deploy == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.target.outputs.deploy == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: install
        if: steps.target.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile

      - name: build
        if: steps.target.outputs.deploy == 'true'
        run: pnpm build

      # Migrations first, then the Worker (`pnpm run deploy`). If a key or the database address is missing this
      # says so instead of failing somewhere deeper.
      - name: deploy
        id: deploy
        if: steps.target.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          set -o pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DIRECT_DATABASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Deploy key missing: $name is not set in the production environment (the owner's setup steps)."
              exit 1
            fi
          done
          # The log is public because the repository is. The migration step prints the database's host name, and a
          # secret masks only its exact value, so the bare host is masked here, before anything runs.
          dbhost=${DIRECT_DATABASE_URL#*://}
          dbhost=${dbhost##*@}
          dbhost=${dbhost%%[/?:]*}
          [ -n "$dbhost" ] && echo "::add-mask::$dbhost"
          pnpm run deploy 2>&1 | tee deploy.log
          # From here a new version is live, so a later failure is worth a rollback hint.
          echo "shipped=true" >>"$GITHUB_OUTPUT"
          version=$(grep -oE 'Current Version ID: [0-9a-f-]{36}' deploy.log | tail -1 | awk '{print $NF}') || true
          if [ -z "$version" ]; then
            echo "::error::The deploy finished but printed no version id, so the live check cannot run."
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: check the live site
        if: steps.target.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ steps.deploy.outputs.version }}
        run: .github/scripts/live-check.sh

      # The games Worker (the gate) goes after the site is live and checked, so a site that failed never ships a new
      # gate. The route is not in the repository (it is public and never names the games domain), so it is a secret,
      # which also masks it in the log. Wrangler puts the new version live before it touches routes and prints its
      # version id only after them, so `games_started` is written before it runs: a failure from here on may mean a
      # new gate is already serving.
      - name: deploy the games Worker
        id: games
        if: steps.target.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GAMES_ROUTE: ${{ secrets.GAMES_ROUTE }}
        run: |
          set -o pipefail
          if [ -z "$GAMES_ROUTE" ]; then
            echo "::error::Games route missing: GAMES_ROUTE is not set in the production environment (the owner's setup step)."
            exit 1
          fi
          # Wrangler prints the bare host in some errors, and a secret masks only its exact value.
          host=${GAMES_ROUTE#*://}
          host=${host#\*.}
          host=${host%%/*}
          echo "::add-mask::$host"
          echo "games_started=true" >>"$GITHUB_OUTPUT"
          pnpm run deploy:games --route "$GAMES_ROUTE" 2>&1 | tee games.log
          version=$(grep -oE 'Current Version ID: [0-9a-f-]{36}' games.log | tail -1 | awk '{print $NF}') || true
          if [ -z "$version" ]; then
            echo "::error::The games deploy finished but printed no version id, so the games check cannot run."
            exit 1
          fi
          echo "games_version=$version" >>"$GITHUB_OUTPUT"

      - name: check the games Worker
        if: steps.target.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ steps.games.outputs.games_version }}
        run: .github/scripts/games-check.sh

      # A migration may already have run, so nothing rolls back by itself. These say how to do it by hand, and for
      # which Worker: the site if the games step never started, the gate if it did (the site is fine then).
      - name: how to roll back the site
        if: failure() && steps.target.outputs.deploy == 'true' && steps.deploy.outputs.shipped == 'true' && steps.games.outcome == 'skipped'
        run: |
          echo "::error::A new version went live but then something failed. To put the previous version back, run: pnpm exec wrangler rollback"
          echo "A migration may already have run, so look at the database before rolling back code that expects the old schema."

      - name: how to roll back the games Worker
        if: failure() && steps.target.outputs.deploy == 'true' && steps.games.outputs.games_started == 'true'
        run: |
          echo "::error::The site is live and fine, but the games Worker deploy or its check failed, so a new games Worker may be serving. To put the previous one back, run: pnpm exec wrangler rollback --name ruken-games"
