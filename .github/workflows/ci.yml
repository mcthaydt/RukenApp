# Ruken's one CI workflow (design 7.4). Owner, 2026-11-13: "we don't run local tests, we do it all in gh cloud runners."
# Every check runs here, on GitHub's own Ubuntu runners: lint, typecheck, unit tests, the build, and the
# browser journeys in a real browser. Tests against a real Postgres run in the postgres job.
# This file changes only on the Owner's words, quoted in the commit (CLAUDE.md). Restored from eda037a at the
# 2026-11-17 setup check (the restart handoff), with the gate, the main-run rule and the empty-suite rule of the
# workflow kit added.
#
# Two speeds (Owner, 2026-11-15: "Yes" to running only the affected tests while a branch is being worked on, with
# the full suite before merge, and to six browser pieces instead of three; then "Cache installs and browsers",
# "Skip the slow picture checks on drafts", "Cancel stale runs" and "Stop at the first failure while working"):
# - A DRAFT pull request gets the quick run: lint, typecheck and the build as always, but only the tests the change
#   reaches, and the first failure stops the run. Its checks carry different names, so they never stand in for the
#   required ones.
# - A pull request that is ready for review, and every push to main, gets the full run: `verify`, `postgres` and
#   `browser`, summed up by the required check `gate`. Marking a draft ready starts it. Nothing merges without it.
#
# Screenshots (Owner, 2026-11-21 06:05 UTC, "Yes, start it" to taking pictures of only the screens a change touches):
# every run, draft or full, on a pull request or on main, attaches a `look:` picture only for the screens its change
# reaches. The `screens` job builds the base and the change, asks the picker (tests/browser/support/changed-screens.ts,
# built in the next pull request) which pages differ, and hands the answer to the browser pieces as LOOK_CHANGED. Any
# doubt (the `screenshots` label, a path in SHOOT_EVERYTHING_WHEN, a build that fails, no picker yet) answers
# {"all":true,...} and every screen is shot. Every journey still runs and checks as before: only the pictures change.
#
# A pull request that changes only .md files has nothing to test (Owner, 2026-11-15: "when a PR only touches .md
# files, skip the tests and allow the merge, in all repos."). The `changes` job spots it, and `verify`, `postgres`
# and `browser` still run and still report success to `gate`, but do no work. They are not left out of
# the workflow with `paths-ignore`, because a required check that never starts stays pending and nothing merges.
# One file that is not .md, or any doubt about what changed, runs everything as before. A push to main always does.
#
# The one required check is `gate`, the last job: it passes only when `verify`, `postgres` and `browser` all passed
# on this run. The commit and pull request identity check is its own workflow, `commit-authors.yml`, because it
# must run again when the pull request's text is edited, and that should not rerun every test.
name: CI

on:
  pull_request:
    # ready_for_review is what starts the full run once a draft is done.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A newer push to the same pull request makes the older run pointless, so it is cancelled and nobody waits on it.
# A run on main is never cancelled: every merge gets its own result.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only, and no secrets are used, so a forked pull request gets nothing it should not have.
permissions:
  contents: read

env:
  # "true" only on a draft pull request: the quick run described above.
  CHANGED_ONLY: ${{ github.event.pull_request.draft == true && 'true' || 'false' }}
  # A change to any of these can break tests that do not import it (the database, the Workers, the tooling), so
  # it makes even a draft run everything.
  RUN_EVERYTHING_WHEN: '^(prisma|cloudflare|tests/fixtures)/|^(pnpm-lock\.yaml|package\.json|vite\.config\.ts|playwright\.config\.ts)$'
  # Read by the `screens` job alone. A change to any of these can change how every screen looks (or the picker itself,
  # the stand-in servers and the helpers the journeys import), so it shoots every screen. RUN_EVERYTHING_WHEN above
  # is a different list and stays as it is, so a draft's choice of tests does not change.
  SHOOT_EVERYTHING_WHEN: '^(prisma|cloudflare|tests/fixtures|tests/browser/support|tests/support)/|^(pnpm-lock\.yaml|package\.json|vite\.config\.ts|playwright\.config\.ts|wrangler\.jsonc|\.github/workflows/ci\.yml)$'

jobs:
  # Says whether the pull request changes only .md files. The jobs below read its answer and, when it is "true",
  # skip their work. If this job fails or says nothing, they see "not true" and run everything: a doubt never
  # skips a test.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.look.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Look for anything that is not a .md file
        id: look
        run: |
          docs_only=false
          # Only a pull request can be docs-only; every push to main is tested in full.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # --no-renames lists both the old and the new name, so moving a code file to a .md name still counts.
            files=$(git diff --name-only --no-renames origin/main...HEAD)
            printf '%s\n' "$files"
            # An empty list is not docs-only: with nothing to go on, run everything.
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '\.md$'; then
              docs_only=true
            fi
          fi
          echo "Only .md files changed: $docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  verify:
    name: ${{ github.event.pull_request.draft && 'verify (quick, draft)' || 'verify' }}
    needs: changes
    # Not `always()`: that would also run after a cancel. This runs even when `changes` failed, which then runs everything.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Only .md files changed, nothing to test
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Only .md files changed. Lint, typecheck, the tests and the build have nothing to check."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.docs_only != 'true'
        with:
          persist-credentials: false
          # The quick run compares with main, so it needs the history.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: needs.changes.outputs.docs_only != 'true'
      # `cache: pnpm` keeps the downloaded packages between runs.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.docs_only != 'true'
      - run: pnpm lint
        if: needs.changes.outputs.docs_only != 'true'
      - run: pnpm typecheck
        if: needs.changes.outputs.docs_only != 'true'
      - name: Unit tests
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          if [ "$CHANGED_ONLY" = "true" ] && ! git diff --name-only origin/main | grep -Eq "$RUN_EVERYTHING_WHEN"; then
            # The tests the change reaches, stopping at the first failure. The two below read files as text, so
            # the import graph cannot tell when they are affected: they always run, so this step never passes on an
            # empty suite.
            reached=$(pnpm exec vitest list --project unit --changed=origin/main --filesOnly 2>/dev/null | grep -E '\.test\.ts$' || true)
            if [ -n "$reached" ]; then
              pnpm test --changed=origin/main --bail=1
            else
              echo "No unit test reaches this change."
            fi
            pnpm test --bail=1 tests/architecture.test.ts tests/wrangler.test.ts
          else
            pnpm test
          fi
      - run: pnpm build
        if: needs.changes.outputs.docs_only != 'true'

  postgres:
    name: ${{ github.event.pull_request.draft && 'postgres (quick, draft)' || 'postgres' }}
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          # A throwaway container's password, not a credential.
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Only .md files changed, nothing to test
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Only .md files changed. The database tests have nothing to check."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.docs_only != 'true'
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: needs.changes.outputs.docs_only != 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.docs_only != 'true'
      - name: Database tests
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          # A draft stops at the first failure; the full run reports every one.
          if [ "$CHANGED_ONLY" = "true" ]; then
            pnpm test:pg --bail=1
          else
            pnpm test:pg
          fi

  # Works out which screens the change reaches, once per run, and hands the answer (one line of JSON, LOOK_CHANGED)
  # to the browser pieces. The picker is tests/browser/support/changed-screens.ts, run as
  #   node tests/browser/support/changed-screens.ts <change build output> <base build output> <file with the changed paths>
  # and it prints the answer on one line. A root file it expects (such as server/entries/params.js, which is written
  # only while the app has a route matcher) that is missing from both builds is nothing to follow, not a crash; one
  # present in only one build counts as changed. Until that file exists this job answers "all" straight after the checkout,
  # before it installs or builds anything. It never fails the run: whatever goes wrong, it answers "all", so a doubt
  # shoots every screen, as a doubt never skips a test. A docs-only pull request skips it, as it skips the pieces.
  screens:
    name: which screens changed
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      look_changed: ${{ steps.decide.outputs.look_changed || steps.compare.outputs.look_changed }}
    env:
      PICKER: tests/browser/support/changed-screens.ts
      PULL_REQUEST_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Answers "all" at once, with no build, when it can already tell. Otherwise says to go on and build.
      - name: See whether a comparison is needed
        id: decide
        run: |
          shoot_all() {
            answer=$(node -p 'JSON.stringify({ all: true, reason: process.argv[1] })' "$1")
            echo "Every screen is shot: $1"
            echo "look_changed=$answer" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ ! -f "$PICKER" ]; then shoot_all "no picker yet"; fi
          case " $PULL_REQUEST_LABELS " in *" screenshots "*) shoot_all "the pull request carries the screenshots label" ;; esac
          head=$(git rev-parse HEAD)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base=$(git merge-base origin/main "$head") || shoot_all "no base to compare with"
          else
            # A push to main: the merge commit of a pull request is compared with its first parent.
            base=$(git rev-parse "$head^1") || shoot_all "no base to compare with"
          fi
          echo "Comparing $head with $base"
          git diff --name-only --no-renames "$base" "$head" > "$RUNNER_TEMP/changed-paths.txt"
          cat "$RUNNER_TEMP/changed-paths.txt"
          if grep -Eq "$SHOOT_EVERYTHING_WHEN" "$RUNNER_TEMP/changed-paths.txt"; then
            shoot_all "a changed file is one that can change every screen ($(grep -E "$SHOOT_EVERYTHING_WHEN" "$RUNNER_TEMP/changed-paths.txt" | head -n 1))"
          fi
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.decide.outputs.build == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.decide.outputs.build == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # A failed install is not a failed run: the next step reads the outcome and answers "all".
      - name: Install
        id: install
        if: steps.decide.outputs.build == 'true'
        continue-on-error: true
        run: pnpm install --frozen-lockfile
      # Builds the change, then the base in the same checkout with the same packages (the lockfile and package.json are
      # in SHOOT_EVERYTHING_WHEN, so the packages are the same for both), and asks the picker.
      - name: Build both and compare
        id: compare
        if: steps.decide.outputs.build == 'true'
        env:
          HEAD_SHA: ${{ steps.decide.outputs.head }}
          BASE_SHA: ${{ steps.decide.outputs.base }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
        run: |
          shoot_all() {
            # Back on the change, whatever happened.
            git checkout --quiet --detach "$HEAD_SHA" || true
            answer=$(node -p 'JSON.stringify({ all: true, reason: process.argv[1] })' "$1")
            echo "Every screen is shot: $1"
            echo "look_changed=$answer" >> "$GITHUB_OUTPUT"
            exit 0
          }
          [ "$INSTALL_OUTCOME" = "success" ] || shoot_all "the install failed"
          out="$RUNNER_TEMP/look"
          rm -rf "$out"; mkdir -p "$out"
          pnpm build || shoot_all "the change did not build"
          cp -r .svelte-kit/output "$out/change"
          git checkout --quiet --detach "$BASE_SHA" || shoot_all "the base could not be checked out"
          rm -rf .svelte-kit/output
          pnpm build || shoot_all "the base did not build"
          cp -r .svelte-kit/output "$out/base"
          git checkout --quiet --detach "$HEAD_SHA"
          answer=$(node "$PICKER" "$out/change" "$out/base" "$RUNNER_TEMP/changed-paths.txt" | head -n 1) || shoot_all "the picker failed"
          [ -n "$answer" ] || shoot_all "the picker gave no answer"
          # A job output is capped at 1 MB and an environment variable at about 128 KB, so a longer answer is not passed on.
          [ "${#answer}" -le 100000 ] || shoot_all "the answer was too long to pass on"
          echo "$answer" | node -e 'JSON.parse(require("fs").readFileSync(0, "utf8"))' || shoot_all "the picker's answer could not be read"
          printf '%s\n' "$answer" | cut -c 1-2000
          echo "look_changed=$answer" >> "$GITHUB_OUTPUT"

  # The journeys are split across six runners, side by side, each with its own database and its own site, so a run
  # stays short as the journeys grow. Playwright deals the test files out among the pieces. On a draft only the
  # journeys the change reaches run, and the first failure stops every piece.
  browser-shard:
    name: browser shard ${{ matrix.shard }} of 6${{ github.event.pull_request.draft && ' (quick, draft)' || '' }}
    needs: [changes, screens]
    # The pieces are not required checks, so a docs-only pull request skips them whole. The `browser` check below
    # accepts that. As with `verify`, a failed `changes` job still runs them.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # The full run wants every piece's result, so a failing piece must not hide the others. A draft wants to hear
      # of the first failure at once.
      fail-fast: ${{ github.event.pull_request.draft == true }}
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:16
        env:
          # A throwaway container's password, not a credential.
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # The `screens` job's answer: which screens to photograph. Empty (that job failed or was skipped) shoots every screen.
      LOOK_CHANGED: ${{ needs.screens.outputs.look_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Asks Playwright which journeys this piece would run, before anything slow starts. A draft piece that has
      # none skips the rest, so it finishes in a minute. Only Playwright's own "No tests found" skips; any other
      # failure still runs the journeys, so a real error is never hidden.
      - name: Pick the journeys
        id: pick
        run: |
          args="--shard=${{ matrix.shard }}/6"
          if [ "$CHANGED_ONLY" = "true" ]; then
            args="$args --max-failures=1"
            if ! git diff --name-only origin/main | grep -Eq "$RUN_EVERYTHING_WHEN"; then
              args="$args --only-changed=origin/main"
            fi
          fi
          status=0
          listing=$(pnpm exec playwright test --list --reporter=list $args 2>&1) || status=$?
          printf '%s\n' "$listing" | tail -n 3
          if [ "$status" -ne 0 ] && printf '%s' "$listing" | grep -q "No tests found"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
      # The browsers are kept between runs, keyed by Playwright's version (pinned exactly in package.json). The
      # install below still adds the system libraries, and downloads a browser only when the cache has none.
      - name: Find Playwright's version
        id: playwright
        if: steps.pick.outputs.run == 'true'
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.pick.outputs.run == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.pick.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chromium webkit
      - if: steps.pick.outputs.run == 'true'
        run: pnpm test:browser ${{ steps.pick.outputs.args }}
      # The report also carries the look's screenshots, which a person looks at (Owner, 2026-11-13: "Screenshots
      # on the board"), so it is kept when every journey passes too.
      - name: Keep the browser report, with the look's screenshots
        if: always() && steps.pick.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # The one check that sums up the browser pieces for `gate`, under the name `browser`: it passes only when
  # every piece above passed. A piece that was cancelled or skipped is not a pass, except when the pull request
  # changes only .md files and every piece was skipped on purpose. On a draft it is named differently,
  # so a draft's quick run can never stand in for the full one.
  browser:
    name: ${{ github.event.pull_request.draft && 'browser (quick, draft)' || 'browser' }}
    needs: [changes, browser-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every piece of the browser journeys passed
        env:
          PIECES_RESULT: ${{ needs.browser-shard.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          # A pull request that changes only .md files skips every piece on purpose, and that counts as a pass.
          if [ "$DOCS_ONLY" = "true" ] && [ "$PIECES_RESULT" = "skipped" ]; then
            echo "Only .md files changed, so no browser journeys were needed."
            exit 0
          fi
          test "$PIECES_RESULT" = "success"

  # The one required check. It passes only when every check above passed on this run. On a pull request that
  # changes only .md files, `verify` and `postgres` pass by doing nothing and `browser` passes with every piece
  # skipped, as the `changes` job decided. On a draft it carries another name, so a quick run never stands in for it.
  gate:
    name: ${{ github.event.pull_request.draft && 'gate (quick, draft)' || 'gate' }}
    needs: [verify, postgres, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check passed
        env:
          VERIFY: ${{ needs.verify.result }}
          POSTGRES: ${{ needs.postgres.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          echo "verify=$VERIFY postgres=$POSTGRES browser=$BROWSER"
          test "$VERIFY" = "success" && test "$POSTGRES" = "success" && test "$BROWSER" = "success"
