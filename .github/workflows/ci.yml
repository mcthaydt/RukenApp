# Ruken's one CI workflow (design 7.4). Owner, 2026-11-13: "we don't run local tests, we do it all in gh cloud runners."
# Every check runs here, on GitHub's own Ubuntu runners: lint, typecheck, unit tests, the build, and the
# browser journeys in a real browser. Tests against a real Postgres run in the postgres job.
# This file changes only on the Owner's words, quoted in the commit (CLAUDE.md).
#
# Two speeds (Owner, 2026-11-15: "Yes" to running only the affected tests while a branch is being worked on, with
# the full suite before merge, and to six browser pieces instead of three; then "Cache installs and browsers",
# "Skip the slow picture checks on drafts", "Cancel stale runs" and "Stop at the first failure while working"):
# - A DRAFT pull request gets the quick run: lint, typecheck and the build as always, but only the tests the change
#   reaches, the first failure stops the run, and the screenshots are taken only when something visual changed or the
#   pull request carries the `screenshots` label (read on the next push). Its checks carry different names, so they
#   never stand in for the required ones.
# - A pull request that is ready for review, and every push to main, gets the full run under the required names
#   `verify`, `postgres` and `browser`. Marking a draft ready starts it. Nothing merges without it.
name: CI

on:
  pull_request:
    # ready_for_review is what starts the full run once a draft is done.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A newer push to the same branch makes the older run pointless, so it is cancelled and nobody waits on it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only, and no secrets are used, so a forked pull request gets nothing it should not have.
permissions:
  contents: read

env:
  # "true" only on a draft pull request: the quick run described above.
  CHANGED_ONLY: ${{ github.event.pull_request.draft == true && 'true' || 'false' }}
  # A change to any of these can break tests that do not import it (the database, the Workers, the tooling), so
  # it makes even a draft run everything.
  RUN_EVERYTHING_WHEN: '^(prisma|cloudflare|tests/fixtures)/|^(pnpm-lock\.yaml|package\.json|vite\.config\.ts|playwright\.config\.ts)$'

jobs:
  verify:
    name: ${{ github.event.pull_request.draft && 'verify (quick, draft)' || 'verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The quick run compares with main, so it needs the history.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # `cache: pnpm` keeps the downloaded packages between runs.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests
        run: |
          if [ "$CHANGED_ONLY" = "true" ] && ! git diff --name-only origin/main | grep -Eq "$RUN_EVERYTHING_WHEN"; then
            # The tests the change reaches, stopping at the first failure. The two below read files as text, so
            # the import graph cannot tell when they are affected: they always run.
            pnpm test --changed=origin/main --passWithNoTests --bail=1
            pnpm test --bail=1 tests/architecture.test.ts tests/wrangler.test.ts
          else
            pnpm test
          fi
      - run: pnpm build

  postgres:
    name: ${{ github.event.pull_request.draft && 'postgres (quick, draft)' || 'postgres' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          # A throwaway container's password, not a credential.
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Database tests
        run: |
          if [ "$CHANGED_ONLY" = "true" ] && ! git diff --name-only origin/main | grep -Eq "$RUN_EVERYTHING_WHEN"; then
            pnpm test:pg --changed=origin/main --passWithNoTests --bail=1
          else
            pnpm test:pg
          fi

  # The journeys are split across six runners, side by side, each with its own database and its own site, so a run
  # stays short as the journeys grow. Playwright deals the test files out among the pieces. On a draft only the
  # journeys the change reaches run, and the first failure stops every piece.
  browser-shard:
    name: browser shard ${{ matrix.shard }} of 6${{ github.event.pull_request.draft && ' (quick, draft)' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # The full run wants every piece's result, so a failing piece must not hide the others. A draft wants to hear
      # of the first failure at once.
      fail-fast: ${{ github.event.pull_request.draft == true }}
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:16
        env:
          # A throwaway container's password, not a credential.
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Asks Playwright which journeys this piece would run, before anything slow starts. A draft piece that has
      # none skips the rest, so it finishes in a minute. Only Playwright's own "No tests found" skips; any other
      # failure still runs the journeys, so a real error is never hidden.
      - name: Pick the journeys
        id: pick
        run: |
          args="--shard=${{ matrix.shard }}/6"
          if [ "$CHANGED_ONLY" = "true" ]; then
            args="$args --max-failures=1"
            if ! git diff --name-only origin/main | grep -Eq "$RUN_EVERYTHING_WHEN"; then
              args="$args --only-changed=origin/main"
            fi
          fi
          status=0
          listing=$(pnpm exec playwright test --list --reporter=list $args 2>&1) || status=$?
          printf '%s\n' "$listing" | tail -n 3
          if [ "$status" -ne 0 ] && printf '%s' "$listing" | grep -q "No tests found"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
      # The journeys attach a screenshot of each screen for the Owner to look at. A draft takes them only when
      # something visual changed, or when the pull request carries the `screenshots` label.
      - name: Decide whether to take the screenshots
        if: steps.pick.outputs.run == 'true'
        env:
          PULL_REQUEST_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          shots=on
          if [ "$CHANGED_ONLY" = "true" ]; then
            shots=off
            if git diff --name-only origin/main | grep -Eq '\.(svelte|css)$|^static/|^tests/browser/(support/)?look'; then
              shots=on
            fi
            case " $PULL_REQUEST_LABELS " in *" screenshots "*) shots=on ;; esac
          fi
          echo "LOOK_SHOTS=$shots" >> "$GITHUB_ENV"
      # The browsers are kept between runs, keyed by Playwright's version (pinned exactly in package.json). The
      # install below still adds the system libraries, and downloads a browser only when the cache has none.
      - name: Find Playwright's version
        id: playwright
        if: steps.pick.outputs.run == 'true'
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.pick.outputs.run == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.pick.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chromium webkit
      - if: steps.pick.outputs.run == 'true'
        run: pnpm test:browser ${{ steps.pick.outputs.args }}
      # The report also carries the look's screenshots, which a person looks at (Owner, 2026-11-13: "Screenshots
      # on the board"), so it is kept when every journey passes too.
      - name: Keep the browser report, with the look's screenshots
        if: always() && steps.pick.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # The one check the branch protection and the auto-merge workflow know by the name `browser`: it passes only when
  # every piece above passed. A piece that was cancelled or skipped is not a pass. On a draft it is named differently,
  # so a draft's quick run can never stand in for the required one.
  browser:
    name: ${{ github.event.pull_request.draft && 'browser (quick, draft)' || 'browser' }}
    needs: browser-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every piece of the browser journeys passed
        env:
          PIECES_RESULT: ${{ needs.browser-shard.result }}
        run: test "$PIECES_RESULT" = "success"
