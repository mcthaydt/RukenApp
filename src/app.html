<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#112f2c" />
    <!--
      Opened from the Home Screen, Ruken is an app with the whole window and no browser bar (manifest.webmanifest,
      display standalone). Safari on an iPhone reads these tags for the same, and its own status bar stays black over
      the top so nothing slides under the clock.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Ruken" />
    <!--
      Guard 4 of the cookie consent (design 3.3). SvelteKit writes three keys to sessionStorage when a tab is hidden or
      left, whatever the visitor chose, and its listeners are added last, so clearing afterwards cannot be ordered.
      This runs before any module: until the server says this browser agreed ("yes"; it fails closed to "no" in any
      page that was not rendered through the gate), `sessionStorage` is a stand-in that lives in this page only.
    -->
    <script data-rk-consent="no">
      (function () {
        var yes = document.currentScript && document.currentScript.getAttribute("data-rk-consent") === "yes";
        var original = Object.getOwnPropertyDescriptor(window, "sessionStorage");
        var kept = {};
        var standIn = {
          getItem: function (key) {
            return Object.prototype.hasOwnProperty.call(kept, key) ? kept[key] : null;
          },
          setItem: function (key, value) {
            kept[key] = String(value);
          },
          removeItem: function (key) {
            delete kept[key];
          },
          clear: function () {
            kept = {};
          },
          key: function (index) {
            return Object.keys(kept)[index] === undefined ? null : Object.keys(kept)[index];
          },
        };
        Object.defineProperty(standIn, "length", {
          get: function () {
            return Object.keys(kept).length;
          },
        });
        function hold() {
          Object.defineProperty(window, "sessionStorage", {
            configurable: true,
            get: function () {
              return standIn;
            },
          });
        }
        window.__rkStorage = {
          hold: hold,
          restore: function () {
            if (original) Object.defineProperty(window, "sessionStorage", original);
            else delete window.sessionStorage;
          },
        };
        if (!yes) hold();
      })();
    </script>
    %sveltekit.head%
    <!--
      Glass only where what is behind it moves (src/lib/moving-behind.svelte): a page that has a moving screen says so in
      its head, and this marks <html> before anything is drawn, so look.css draws its bar and buttons as glass from the
      first frame.
    -->
    <script>
      if (document.head.querySelector('meta[name="glass"]'))
        document.documentElement.setAttribute("data-glass", "");
    </script>
  </head>
  <body data-sveltekit-preload-data="hover" tabindex="-1">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
